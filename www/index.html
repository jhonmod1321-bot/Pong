<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Pong</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const W=360,H=640,PW=72,PH=10,R=6,PY=H-40,CY=40;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let scale=1,ox=0,oy=0;
function resize(){
  const d=window.devicePixelRatio||1;
  cv.width=innerWidth*d;cv.height=innerHeight*d;
  scale=Math.min(cv.width/W,cv.height/H);
  ox=(cv.width-W*scale)/2;oy=(cv.height-H*scale)/2;
}
addEventListener('resize',resize);resize();

const FONT={0:'111101101101111',1:'010110010010111',2:'111001111100111',3:'111001111001111',4:'101101111001001',
5:'111100111001111',6:'111100111101111',7:'111001001001001',8:'111101111101111',9:'111101111001111'};
function dots(str,x,y,s){
  let cx=x;
  for(const ch of String(str)){
    const g=FONT[ch];
    for(let i=0;i<15;i++){
      ctx.beginPath();ctx.arc(cx+(i%3)*s+s/2,y+Math.floor(i/3)*s+s/2,s*0.38,0,7);
      ctx.fillStyle=g[i]==='1'?'#fff':'#1c1c1c';ctx.fill();
    }
    cx+=s*4;
  }
}

/* ---- audio ---- */
let AC=null;
function beep(f,d=.07,type='square',v=.07){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
function fs(){const d=document.documentElement;if(!document.fullscreenElement&&!document.webkitFullscreenElement){(d.requestFullscreen||d.webkitRequestFullscreen||function(){}).call(d);}else{(document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document);}}

/* ---- estado ---- */
const CPUSP=[2.1,2.9,3.9],LV=['FÁCIL','NORMAL','DIFÍCIL'];
const LIM=[7,11],MN=['A 7','A 11','SIN LÍMITE'];
let level=1,mode=0;
let rec={w7:0,w11:0,best:0};
try{const r=JSON.parse(localStorage.getItem('pong_rec'));if(r)rec=Object.assign(rec,r);}catch(e){}
function saveRec(){try{localStorage.setItem('pong_rec',JSON.stringify(rec));}catch(e){}}
function recText(){return mode===2?'RÉCORD: '+rec.best+' PUNTOS':'VICTORIAS: '+(mode===0?rec.w7:rec.w11);}

const pl={x:W/2},cpu={x:W/2};
let balls=[],sp=0,cs=0,state='ready',msg='TOCA PARA JUGAR',speed=4.2,dir=1;
let streakP=0,streakC=0,multi=false,flash=0,flashTxt='';

function serve(d){speed=4.2;balls=[{x:W/2,y:H/2,vx:(Math.random()-.5)*3,vy:speed*d}];}
function start(){
  if(state==='over'||state==='ready'){sp=0;cs=0;}
  streakP=0;streakC=0;multi=false;
  state='play';serve(dir);
}
function pause(){if(state==='play')state='pause';}
function resume(){if(state==='pause')state='play';}

function multiply(sy){ // sy=-1 hacia la CPU, 1 hacia el jugador
  const total=3+Math.floor(Math.random()*2); // 3 o 4 bolas
  balls=[];
  for(let i=0;i<total;i++){
    const ang=-0.9+1.8*(i/(total-1))+(Math.random()-.5)*0.25;
    const v=Math.max(speed,4.4);
    balls.push({x:W/2+(Math.random()-.5)*40,y:H/2,vx:Math.sin(ang)*v,vy:sy*Math.cos(ang)*v});
  }
  multi=true;flash=80;flashTxt='¡MULTIBOLA x'+total+'!';
  beep(300,.1);setTimeout(()=>beep(450,.1),100);setTimeout(()=>beep(700,.15),200);
}

function finish(){
  state='over';balls=[];
  if(mode===2){
    if(sp>rec.best){rec.best=sp;saveRec();msg='¡NUEVO RÉCORD! '+sp;
      beep(523,.15);setTimeout(()=>beep(659,.15),150);setTimeout(()=>beep(784,.3),300);}
    else msg='FIN: '+sp+' PUNTOS';
  }else if(sp>cs){
    if(mode===0)rec.w7++;else rec.w11++;saveRec();msg='¡GANASTE! TOCA';
    beep(523,.15);setTimeout(()=>beep(659,.15),150);setTimeout(()=>beep(784,.3),300);
  }else msg='PERDISTE. TOCA';
}
function checkOver(){
  const over=mode===2?cs>=3:(sp>=LIM[mode]||cs>=LIM[mode]);
  if(over)finish();
  return over;
}
function endRound(){
  multi=false;
  if(streakP>=3){streakP=0;streakC=0;serve(-1);multiply(-1);}
  else if(streakC>=3){streakP=0;streakC=0;serve(1);multiply(1);}
  else serve(dir);
}

/* ---- entrada ---- */
function lx(cx){return((cx*(window.devicePixelRatio||1))-ox)/scale;}
function ly(cy){return((cy*(window.devicePixelRatio||1))-oy)/scale;}
function input(cx){pl.x=Math.max(PW/2,Math.min(W-PW/2,lx(cx)));}
function press(cx,cy){
  const x=lx(cx),y=ly(cy);
  if(state==='play'){
    if(x<56&&y<56){pause();beep(400,.05);return;}
    input(cx);return;
  }
  if(state==='pause'){
    if(y>H/2-10&&y<H/2+34){resume();beep(600,.05);}
    else if(y>H/2+46&&y<H/2+90){state='ready';msg='TOCA PARA JUGAR';sp=0;cs=0;balls=[];beep(300,.05);}
    return;
  }
  if(x>W-48&&y<48){fs();return;}
  if(y>H/2+106&&y<H/2+146){mode=Math.max(0,Math.min(2,Math.floor((x-15)/110)));beep(660,.05);return;}
  if(y>H/2+152&&y<H/2+192){level=Math.max(0,Math.min(2,Math.floor((x-15)/110)));beep(660,.05);return;}
  input(cx);start();
}
cv.addEventListener('touchstart',e=>{e.preventDefault();press(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();if(state==='play')input(e.touches[0].clientX);},{passive:false});
cv.addEventListener('mousemove',e=>{if(state==='play')input(e.clientX);});
cv.addEventListener('mousedown',e=>press(e.clientX,e.clientY));
const keys={};
addEventListener('keydown',e=>{
  keys[e.key]=1;
  if(e.key==='p'||e.key==='P'||e.key==='Escape'){if(state==='play')pause();else resume();}
  if((state==='ready'||state==='over')&&(e.key===' '||e.key==='Enter'))start();
});
addEventListener('keyup',e=>keys[e.key]=0);
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
addEventListener('blur',pause);

/* ---- lógica ---- */
function update(dt){
  if(flash>0)flash-=dt;
  if(keys.ArrowLeft)pl.x=Math.max(PW/2,pl.x-6*dt);
  if(keys.ArrowRight)pl.x=Math.min(W-PW/2,pl.x+6*dt);
  if(state!=='play')return;

  let tgt=null,best=1e9;
  for(const b of balls){if(b.vy<0&&b.y<best){best=b.y;tgt=b;}}
  const cmax=CPUSP[level]*dt,diff=(tgt?tgt.x:W/2)-cpu.x;
  cpu.x+=Math.max(-cmax,Math.min(cmax,diff));
  cpu.x=Math.max(PW/2,Math.min(W-PW/2,cpu.x));

  let gotP=0,gotC=0;const alive=[];
  for(const b of balls){
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.x<R){b.x=R;b.vx=Math.abs(b.vx);beep(220,.04);}
    if(b.x>W-R){b.x=W-R;b.vx=-Math.abs(b.vx);beep(220,.04);}
    const hit=(p,py,down)=>{
      if(Math.abs(b.x-p.x)<=PW/2+R&&b.y+R>=py-PH/2&&b.y-R<=py+PH/2){
        const v=Math.min(Math.hypot(b.vx,b.vy)*1.03,11);
        speed=Math.min(speed*1.03,11);
        const off=(b.x-p.x)/(PW/2);
        b.vx=off*v*0.8;
        b.vy=(down?-1:1)*Math.sqrt(Math.max(v*v-b.vx*b.vx,4));
        b.y=down?py-PH/2-R:py+PH/2+R;
        beep(down?520:420,.06);
      }
    };
    if(b.vy>0)hit(pl,PY,true);
    if(b.vy<0)hit(cpu,CY,false);
    if(b.y>H+R){cs++;gotC++;if(!multi){streakC++;streakP=0;}}
    else if(b.y<-R){sp++;gotP++;if(!multi){streakP++;streakC=0;}}
    else alive.push(b);
  }
  balls=alive;
  if(gotP||gotC){
    beep(gotP>gotC?880:150,.2,gotP>gotC?'square':'sawtooth');
    if(gotC&&navigator.vibrate)navigator.vibrate(60);
    dir=gotP>gotC?-1:1;
    if(!checkOver()&&balls.length===0)endRound();
  }
}

/* ---- dibujo ---- */
function btn(x,y,w,h,label,on){
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(x,y,w,h);
  if(on){ctx.fillStyle='#fff';ctx.fillRect(x,y,w,h);ctx.fillStyle='#000';}else ctx.fillStyle='#fff';
  ctx.fillText(label,x+w/2,y+h/2+4);
}
function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(scale,0,0,scale,ox,oy);
  ctx.fillStyle='#fff';
  for(let x=8;x<W;x+=28)ctx.fillRect(x,H/2-1.5,14,3);
  dots(cs,W-70,H/2-57,7);
  dots(sp,W-70,H/2+22,7);
  ctx.fillRect(cpu.x-PW/2,CY-PH/2,PW,PH);
  ctx.fillRect(pl.x-PW/2,PY-PH/2,PW,PH);
  for(const b of balls){ctx.beginPath();ctx.arc(b.x,b.y,R,0,7);ctx.fill();}
  ctx.textAlign='center';
  if(state==='play'||state==='pause'){
    ctx.font='bold 11px "Courier New",monospace';ctx.fillStyle='#888';
    ctx.fillText('RACHA '+streakP,W/2,H-12);
    ctx.fillText('RACHA '+streakC,W/2,22);
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(12,12,26,26);
    ctx.fillStyle='#fff';ctx.fillRect(19,18,5,14);ctx.fillRect(28,18,5,14);
    if(mode===2){ // vidas
      for(let i=0;i<3;i++){
        ctx.beginPath();ctx.arc(20+i*16,H-14,5,0,7);
        if(i<3-cs){ctx.fillStyle='#fff';ctx.fill();}else{ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();}
      }
    }
  }
  if(flash>0&&state==='play'){
    ctx.font='bold 22px "Courier New",monospace';ctx.fillStyle='#fff';
    ctx.fillText(flashTxt,W/2,H/2-40);
  }
  if(state==='pause'){
    ctx.fillStyle='rgba(0,0,0,.85)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 30px "Courier New",monospace';
    ctx.fillText('PAUSA',W/2,H/2-50);
    ctx.font='bold 16px "Courier New",monospace';
    btn(70,H/2-10,220,44,'CONTINUAR',false);
    btn(70,H/2+46,220,44,'MENÚ',false);
  }
  if(state==='ready'||state==='over'){
    ctx.font='bold 18px "Courier New",monospace';
    ctx.fillStyle='#fff';ctx.fillText(msg,W/2,H/2+84);
    ctx.font='bold 12px "Courier New",monospace';
    for(let i=0;i<3;i++)btn(15+i*110,H/2+106,100,34,MN[i],i===mode);
    for(let i=0;i<3;i++)btn(15+i*110,H/2+152,100,34,LV[i],i===level);
    ctx.fillStyle='#888';ctx.fillText(recText(),W/2,H/2+214);
    ctx.strokeStyle='#fff';ctx.lineWidth=2;
    ctx.strokeRect(W-34,12,22,22);ctx.strokeRect(W-30,16,14,14);
  }
}
let last=performance.now();
function loop(t){
  const dt=Math.min((t-last)/16.67,3);last=t;
  update(dt);draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
