<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Pong</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const W=360,H=640,PW=72,PH=10,R=6,WIN=7;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let scale=1,ox=0,oy=0;
function resize(){
  const d=window.devicePixelRatio||1;
  cv.width=innerWidth*d;cv.height=innerHeight*d;
  scale=Math.min(cv.width/W,cv.height/H);
  ox=(cv.width-W*scale)/2;oy=(cv.height-H*scale)/2;
}
addEventListener('resize',resize);resize();

const FONT={
0:'111101101101111',1:'010110010010111',2:'111001111100111',3:'111001111001111',4:'101101111001001',
5:'111100111001111',6:'111100111101111',7:'111001001001001',8:'111101111101111',9:'111101111001111'};
function dots(str,x,y,s){ // dot-matrix digits
  let cx=x;
  for(const ch of String(str)){
    const g=FONT[ch];
    for(let i=0;i<15;i++){
      const px=cx+(i%3)*s,py=y+Math.floor(i/3)*s;
      ctx.beginPath();ctx.arc(px+s/2,py+s/2,s*0.38,0,7);
      ctx.fillStyle=g[i]==='1'?'#fff':'#1c1c1c';ctx.fill();
    }
    cx+=s*4;
  }
}

const pl={x:W/2},cpu={x:W/2},ball={x:W/2,y:H/2,vx:0,vy:0};
let sp=0,cs=0,state='ready',msg='TOCA PARA JUGAR',speed=4.2,dir=1,level=1;
const CPUSP=[2.1,2.9,3.9],LV=['FÁCIL','NORMAL','DIFÍCIL'];
let AC=null;
function beep(f,d=.07,type='square',v=.07){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
function fs(){const d=document.documentElement;if(!document.fullscreenElement&&!document.webkitFullscreenElement){(d.requestFullscreen||d.webkitRequestFullscreen||function(){}).call(d);}else{(document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document);}}

function serve(d){
  ball.x=W/2;ball.y=H/2;speed=4.2;
  ball.vx=(Math.random()-.5)*3;ball.vy=speed*d;
}
function start(){
  if(state==='over'){sp=0;cs=0;}
  state='play';serve(dir);
}
function lx(cx){return((cx*(window.devicePixelRatio||1))-ox)/scale;}
function ly(cy){return((cy*(window.devicePixelRatio||1))-oy)/scale;}
function input(clientX){
  pl.x=Math.max(PW/2,Math.min(W-PW/2,lx(clientX)));
}
function press(cx,cy){
  input(cx);
  if(state==='play')return;
  const x=lx(cx),y=ly(cy);
  if(x>W-48&&y<48){fs();return;}
  if(y>H/2+104&&y<H/2+154){level=Math.max(0,Math.min(2,Math.floor((x-15)/110)));beep(660,.05);return;}
  start();
}
cv.addEventListener('touchstart',e=>{e.preventDefault();press(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();input(e.touches[0].clientX);},{passive:false});
cv.addEventListener('mousemove',e=>input(e.clientX));
cv.addEventListener('mousedown',e=>press(e.clientX,e.clientY));
const keys={};
addEventListener('keydown',e=>{keys[e.key]=1;if(state!=='play'&&(e.key===' '||e.key==='Enter'))start();});
addEventListener('keyup',e=>keys[e.key]=0);

const PY=H-40,CY=40;
function update(dt){
  if(keys.ArrowLeft)pl.x=Math.max(PW/2,pl.x-6*dt);
  if(keys.ArrowRight)pl.x=Math.min(W-PW/2,pl.x+6*dt);
  if(state!=='play'){ // idle: cpu drifts
    return;
  }
  // CPU follows ball with limited speed
  const target=ball.vy<0?ball.x:W/2, cmax=CPUSP[level]*dt;
  const diff=target-cpu.x;
  cpu.x+=Math.max(-cmax,Math.min(cmax,diff));
  cpu.x=Math.max(PW/2,Math.min(W-PW/2,cpu.x));

  ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
  if(ball.x<R){ball.x=R;ball.vx=Math.abs(ball.vx);beep(220,.04);}
  if(ball.x>W-R){ball.x=W-R;ball.vx=-Math.abs(ball.vx);beep(220,.04);}

  const hit=(p,py,down)=>{
    if(Math.abs(ball.x-p.x)<=PW/2+R && ball.y+R>=py-PH/2 && ball.y-R<=py+PH/2){
      speed=Math.min(speed*1.05,11);
      const off=(ball.x-p.x)/(PW/2);
      ball.vx=off*speed*0.8;
      ball.vy=(down?-1:1)*Math.sqrt(Math.max(speed*speed-ball.vx*ball.vx,4));
      ball.y=down?py-PH/2-R:py+PH/2+R;
      beep(down?520:420,.06);
    }
  };
  if(ball.vy>0)hit(pl,PY,true);
  if(ball.vy<0)hit(cpu,CY,false);

  if(ball.y>H+R){cs++;point(1);}
  else if(ball.y<-R){sp++;point(-1);}
}
function point(d){
  dir=d;
  beep(d<0?880:150,.25,d<0?'square':'sawtooth');
  if(d>0&&navigator.vibrate)navigator.vibrate(60);
  if(sp>=WIN||cs>=WIN){
    state='over';msg=sp>cs?'¡GANASTE! TOCA':'PERDISTE. TOCA';
    if(sp>cs){beep(523,.15);setTimeout(()=>beep(659,.15),150);setTimeout(()=>beep(784,.3),300);}
    ball.x=W/2;ball.y=H/2;ball.vx=ball.vy=0;
  }else serve(d);
}

function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(scale,0,0,scale,ox,oy);
  // center dashed line
  ctx.fillStyle='#fff';
  for(let x=8;x<W;x+=28)ctx.fillRect(x,H/2-1.5,14,3);
  // scores (dot-matrix): CPU top half, player bottom half
  const s=7;
  dots(cs,W-70,H/2-15*0-8-5*s-14,s);
  dots(sp,W-70,H/2+22,s);
  // paddles
  ctx.fillStyle='#fff';
  ctx.fillRect(cpu.x-PW/2,CY-PH/2,PW,PH);
  ctx.fillRect(pl.x-PW/2,PY-PH/2,PW,PH);
  // ball
  ctx.beginPath();ctx.arc(ball.x,ball.y,R,0,7);ctx.fill();
  if(state!=='play'){
    ctx.font='bold 18px "Courier New",monospace';ctx.textAlign='center';
    ctx.fillStyle='#fff';ctx.fillText(msg,W/2,H/2+90);
    ctx.font='bold 13px "Courier New",monospace';
    for(let i=0;i<3;i++){
      const bx=15+i*110,by=H/2+112;
      ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(bx,by,100,34);
      if(i===level){ctx.fillStyle='#fff';ctx.fillRect(bx,by,100,34);ctx.fillStyle='#000';}else ctx.fillStyle='#fff';
      ctx.fillText(LV[i],bx+50,by+22);
    }
    ctx.strokeStyle='#fff';ctx.lineWidth=2;
    ctx.strokeRect(W-34,12,22,22);ctx.strokeRect(W-30,16,14,14);
  }
}
let last=performance.now();
function loop(t){
  const dt=Math.min((t-last)/16.67,3);last=t;
  update(dt);draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
